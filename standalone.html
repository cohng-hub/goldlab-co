<body class="bg-darkbg bg-radial-lights text-slate-100 min-h-screen flex flex-col antialiased">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo } = React;

    const DEFAULT_BASE_URL = 'http://127.0.0.1:1234';

    const TONE_DESCRIPTIONS = {
      'viral': '바이럴 후킹형 — 강렬한 호기심 유발, 짧고 임팩트 있는 문장, 반전과 넘버링 활용',
      'friendly': '친근·유쾌형 — 따뜻하고 공감대를 형성하는 어투, 일상적인 표현과 위트, 대화하듯 편안한 스타일',
      'expert': '전문가형 — 신뢰감 있고 논리적인 어투, 데이터와 인사이트 중심, 깊이 있는 통찰 제시',
      'direct': '직설·팩트폭격형 — 거품 없는 솔직하고 대담한 어투, 핵심만 팩트로 찌르는 직관적인 문장'
    };

    // Clean <think>...</think> tags (including unclosed <think>...)
    function filterThinkTags(text) {
      if (!text) return '';
      let cleaned = text.replace(/<think>[\s\S]*?<\/think>/gi, '');
      cleaned = cleaned.replace(/<think>[\s\S]*/gi, '');
      return cleaned;
    }

    // Parse posts from delimiter ###POST### or fallbacks
    function parsePosts(text) {
      if (!text) return [];
      const cleaned = filterThinkTags(text).trim();
      if (!cleaned) return [];

      // 1. Multi-pattern regex delimiter: ###POST###, ### 1/5, ### 1., [1/5], 1/5, ---
      const postDelimiterRegex = /(?:#{2,}\s*POST\s*#{2,}|#{2,}\s*\d+[\/\.]\d*|(?:\r?\n){2,}(?:\[?\d+[\/\.]\d*\]?|\d+\.)\s*|---|\*\*\*)/gi;

      let rawParts = cleaned.split(postDelimiterRegex);

      let validParts = rawParts
        .map(p => {
          let str = p.trim();
          // Strip leftover markdown headings or bold headers dumped by LLM
          str = str.replace(/^#{1,6}\s*\d+[\/\.]\d*/gi, '');
          str = str.replace(/^\[?\d+[\/\.]\d*\]?/gi, '');
          str = str.replace(/\*\*(?:타깃 독자 분석|직거래소에서|전문가와|금니와 부러진|부러진 금반지|주요 독자층|핵심 페인포인트|후킹 앵글)[\s\S]*?\*\*/gi, '');
          return str.trim();
        })
        .filter(p => p.length > 0);

      if (validParts.length > 0) {
        return validParts.map((content, idx) => ({
          id: `post-${idx + 1}-${content.slice(0, 10).replace(/\s+/g, '')}`,
          content,
          charCount: content.length
        }));
      }

      return [{
        id: `post-0-${Date.now()}`,
        content: cleaned,
        charCount: cleaned.length
      }];
    }

    function App() {
      // AI Engine & API Key States
      const [engine, setEngine] = useState(() => {
        try { return localStorage.getItem('gold_ai_engine') || 'gemini'; } catch(e) { return 'gemini'; }
      });
      const [geminiApiKey, setGeminiApiKey] = useState(() => {
        try { return localStorage.getItem('gold_gemini_api_key') || ''; } catch(e) { return ''; }
      });
      const [inputGeminiKey, setInputGeminiKey] = useState(geminiApiKey);
      const [geminiModel, setGeminiModel] = useState('gemini-1.5-flash');
      const [geminiModelList, setGeminiModelList] = useState([]);

      // Dynamic Gemini Model Discovery via ModelService.ListModels
      const fetchGeminiModels = async (key) => {
        if (!key || !key.trim()) return [];
        const cleanKey = key.trim();
        const urls = [
          `https://generativelanguage.googleapis.com/v1beta/models?key=${cleanKey}`,
          `https://generativelanguage.googleapis.com/v1/models?key=${cleanKey}`
        ];
        for (const url of urls) {
          try {
            const res = await fetch(url);
            if (res.ok) {
              const data = await res.json();
              const valid = (data.models || [])
                .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
                .map(m => m.name.replace(/^models\//, ''));
              if (valid.length > 0) return valid;
            }
          } catch (e) {}
        }
        return [];
      };

      // LM Studio & Health Check States
      const [baseUrl, setBaseUrl] = useState(DEFAULT_BASE_URL);
      const [models, setModels] = useState([]);
      const [selectedModel, setSelectedModel] = useState('');
      const [isConnected, setIsConnected] = useState(false);
      const [isCheckingHealth, setIsCheckingHealth] = useState(false);

      // UI Settings Modal & Error Banner
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [settingsInputUrl, setSettingsInputUrl] = useState(DEFAULT_BASE_URL);
      const [testMessage, setTestMessage] = useState(null);
      const [errorMessage, setErrorMessage] = useState(null);

      // Form States
      const [generationMode, setGenerationMode] = useState('deep'); // 'deep' | 'fast'
      const [platform, setPlatform] = useState('threads'); // 'threads' (500) | 'twitter' (280)
      const [postLength, setPostLength] = useState('single'); // default: 'single' (단일 포스트 1개 + 첫번째 댓글)
      const [tone, setTone] = useState('viral');
      const [topic, setTopic] = useState('');
      const [targetAudience, setTargetAudience] = useState('');
      const [keyNotes, setKeyNotes] = useState('');

      // Generation Execution States
      const [isGenerating, setIsGenerating] = useState(false);
      const [currentStep, setCurrentStep] = useState(0); // 0: idle, 1: research, 2: strategy, 3: final
      const [reasoningText, setReasoningText] = useState('');

      // Content Outputs
      const [researchOutput, setResearchOutput] = useState('');
      const [strategyOutput, setStrategyOutput] = useState('');
      const [finalRawOutput, setFinalRawOutput] = useState('');

      // Accordion & Report View States
      const [isReportOpen, setIsReportOpen] = useState(true);
      const [activeReportTab, setActiveReportTab] = useState('research'); // 'research' | 'strategy'

      // History state (last 20 memory items)
      const [history, setHistory] = useState([]);

      // Copy feedback states
      const [copiedCardId, setCopiedCardId] = useState(null);
      const [copiedAll, setCopiedAll] = useState(false);

      // References for streaming & auto scroll
      const abortControllerRef = useRef(null);
      const reportContentRef = useRef(null);

      const maxCharLimit = platform === 'threads' ? 500 : 280;

      useEffect(() => {
        localStorage.setItem('gold_ai_engine', engine);
      }, [engine]);

      useEffect(() => {
        localStorage.setItem('gold_gemini_api_key', geminiApiKey);
        if (geminiApiKey.trim()) {
          fetchGeminiModels(geminiApiKey).then(m => {
            if (m.length > 0) setGeminiModelList(m);
          });
        }
      }, [geminiApiKey]);

      // 1. Health Check Function (GET /v1/models, 4s timeout, excludes 'embed')
      const checkHealth = async (targetUrl = baseUrl) => {
        setIsCheckingHealth(true);
        let activeUrl = targetUrl;

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 4000);
          let res;

          try {
            res = await fetch(`${targetUrl.replace(/\/$/, '')}/v1/models`, {
              method: 'GET',
              signal: controller.signal
            });
            clearTimeout(timeoutId);
          } catch (directErr) {
            clearTimeout(timeoutId);
            if (window.location.origin && window.location.origin.startsWith('http') && window.location.origin !== targetUrl) {
              const fallbackController = new AbortController();
              const fallbackTimeout = setTimeout(() => fallbackController.abort(), 4000);
              res = await fetch(`${window.location.origin}/v1/models`, {
                method: 'GET',
                signal: fallbackController.signal
              });
              clearTimeout(fallbackTimeout);
              activeUrl = window.location.origin;
              setBaseUrl(activeUrl);
            } else {
              throw directErr;
            }
          }

          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          const availableModels = (data.data || [])
            .map(m => m.id)
            .filter(id => !id.toLowerCase().includes('embed'));

          setModels(availableModels);
          setIsConnected(true);

          if (availableModels.length > 0) {
            if (!selectedModel || !availableModels.includes(selectedModel)) {
              setSelectedModel(availableModels[0]);
            }
          } else {
            setSelectedModel('');
          }
          return { success: true, count: availableModels.length };
        } catch (err) {
          setIsConnected(false);
          setModels([]);
          return { success: false, error: err.message };
        } finally {
          setIsCheckingHealth(false);
        }
      };

      // Auto periodic health check every 15s (skip during generation)
      useEffect(() => {
        checkHealth(baseUrl);
        const interval = setInterval(() => {
          if (!isGenerating && engine === 'lmstudio') {
            checkHealth(baseUrl);
          }
        }, 15000);
        return () => clearInterval(interval);
      }, [baseUrl, isGenerating, engine]);

      // Save settings modal
      const handleSaveSettings = async () => {
        const cleanKey = inputGeminiKey.trim();
        setGeminiApiKey(cleanKey);
        const cleanUrl = settingsInputUrl.trim().replace(/\/$/, '');
        setBaseUrl(cleanUrl);

        if (engine === 'lmstudio') {
          const result = await checkHealth(cleanUrl);
          if (result.success) {
            setTestMessage({ type: 'success', text: `LM Studio 연결 성공! (${result.count}개 모델 검색됨)` });
          } else {
            setTestMessage({ type: 'error', text: 'LM Studio 서버 연결 실패' });
            return;
          }
        } else {
          if (!cleanKey) {
            setTestMessage({ type: 'error', text: 'Gemini API 키를 입력해주세요.' });
            return;
          }
          setTestMessage({ type: 'info', text: 'Google API 키 확인 중...' });
          const liveModels = await fetchGeminiModels(cleanKey);
          if (liveModels.length > 0) {
            setGeminiModelList(liveModels);
            if (!liveModels.includes(geminiModel)) setGeminiModel(liveModels[0]);
            setTestMessage({ type: 'success', text: `연결 성공! (${liveModels.length}개 Gemini 모델 확인됨)` });
          } else {
            setTestMessage({ type: 'error', text: 'Gemini API 키를 확인해주세요. (Google AI Studio 키 필요)' });
            return;
          }
        }

        setTimeout(() => {
          setShowSettingsModal(false);
          setTestMessage(null);
        }, 1200);
      };

      // Auto scroll streaming text box
      const scrollToBottom = () => {
        if (reportContentRef.current) {
          reportContentRef.current.scrollTop = reportContentRef.current.scrollHeight;
        }
      };

      // 2. Generic Streaming Chat Completion Handler (Gemini & LM Studio SSE)
      const streamCompletion = async ({ systemPrompt, userMessage, temperature = 0.75, maxTokens = 4096, onToken, onReasoning = () => {} }) => {
        const controller = new AbortController();
        abortControllerRef.current = controller;

        if (engine === 'gemini') {
          const cleanKey = geminiApiKey.trim();
          if (!cleanKey) {
            setShowSettingsModal(true);
            throw new Error('Google Gemini API 키가 설정되지 않았습니다. ⚙️ 설정 창에서 무료 키를 입력해 주세요.');
          }

          let candidateNames = [];
          if (geminiModel) candidateNames.push(geminiModel);
          if (geminiModelList.length > 0) {
            candidateNames = [...candidateNames, ...geminiModelList];
          }
          candidateNames = [...candidateNames, 'gemini-1.5-flash', 'gemini-1.5-flash-latest', 'gemini-1.5-pro', 'gemini-1.5-pro-latest', 'gemini-2.0-flash-exp', 'gemini-pro']
            .filter((v, i, a) => v && a.indexOf(v) === i);

          let success = false;
          let lastErrorMsg = '';

          for (const modelId of candidateNames) {
            const apiVersions = ['v1beta', 'v1'];
            for (const apiVer of apiVersions) {
              const url = `https://generativelanguage.googleapis.com/${apiVer}/models/${modelId}:streamGenerateContent?alt=sse&key=${cleanKey}`;
              try {
                const res = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  signal: controller.signal,
                  body: JSON.stringify({
                    contents: [
                      { role: 'user', parts: [{ text: `[시스템 지침]\n${systemPrompt}\n\n[사용자 요청]\n${userMessage}` }] }
                    ],
                    generationConfig: {
                      temperature: temperature,
                      maxOutputTokens: maxTokens
                    }
                  })
                });

                if (res.ok) {
                  const reader = res.body.getReader();
                  const decoder = new TextDecoder('utf-8');
                  let buffer = '';

                  while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                      const trimmed = line.trim();
                      if (!trimmed || !trimmed.startsWith('data: ')) continue;
                      const jsonStr = trimmed.slice(6);
                      try {
                        const parsed = JSON.parse(jsonStr);
                        const candidates = parsed.candidates || [];
                        for (const cand of candidates) {
                          const parts = cand.content?.parts || [];
                          for (const pt of parts) {
                            if (pt.text) onToken(pt.text);
                          }
                        }
                      } catch (e) {}
                    }
                  }

                  success = true;
                  if (geminiModel !== modelId) setGeminiModel(modelId);
                  break;
                } else {
                  // Fallback: Non-streaming generateContent
                  const nsUrl = `https://generativelanguage.googleapis.com/${apiVer}/models/${modelId}:generateContent?key=${cleanKey}`;
                  const nsRes = await fetch(nsUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    signal: controller.signal,
                    body: JSON.stringify({
                      contents: [
                        { role: 'user', parts: [{ text: `[시스템 지침]\n${systemPrompt}\n\n[사용자 요청]\n${userMessage}` }] }
                      ],
                      generationConfig: {
                        temperature: temperature,
                        maxOutputTokens: maxTokens
                      }
                    })
                  });

                  if (nsRes.ok) {
                    const nsData = await nsRes.json();
                    const text = nsData.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    if (text) {
                      onToken(text);
                      success = true;
                      if (geminiModel !== modelId) setGeminiModel(modelId);
                      break;
                    }
                  } else {
                    const errJson = await res.json().catch(() => ({}));
                    lastErrorMsg = errJson.error?.message || `HTTP ${res.status}`;
                  }
                }
              } catch (e) {
                lastErrorMsg = e.message;
              }
            }
            if (success) break;
          }

          if (!success) {
            throw new Error(`Google Gemini API 오류: ${lastErrorMsg || '유효한 Gemini API Key를 확인해주세요.'}`);
          }
          return;
        }

        // LM Studio Streaming Execution
        const response = await fetch(`${baseUrl.replace(/\/$/, '')}/v1/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({
            model: selectedModel,
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: userMessage }
            ],
            temperature: temperature,
            max_tokens: maxTokens,
            stream: true
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`[LM Studio API 오류 ${response.status}] ${errText}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || !trimmed.startsWith('data: ')) continue;
            const dataStr = trimmed.slice(6);
            if (dataStr === '[DONE]') continue;

            try {
              const parsed = JSON.parse(dataStr);
              const delta = parsed.choices?.[0]?.delta || {};

              const reasoningChunk = delta.reasoning_content || delta.reasoning;
              if (reasoningChunk) {
                onReasoning(reasoningChunk);
              }

              if (delta.content) {
                onToken(delta.content);
              }
            } catch (e) {}
          }
        }
      };

      // Stop generation handler
      const handleStopGeneration = () => {
        if (abortControllerRef.current) {
          abortControllerRef.current.abort();
          abortControllerRef.current = null;
        }
        setIsGenerating(false);
        setErrorMessage('사용자가 글 생성을 중단했습니다.');
      };

      // 3. Main Generation Pipeline Trigger
      const handleStartGenerate = async () => {
        if (!topic.trim()) {
          setErrorMessage('주제를 입력해주세요.');
          return;
        }
        if (!isConnected) {
          setShowSettingsModal(true);
          setErrorMessage('LM Studio 서버에 연결되어 있지 않습니다. 서버 상태를 확인해주세요.');
          return;
        }
        if (!selectedModel) {
          setErrorMessage('사용 가능한 LLM 모델이 선택되지 않았습니다.');
          return;
        }

        setErrorMessage(null);
        setIsGenerating(true);
        setReasoningText('');
        setResearchOutput('');
        setStrategyOutput('');
        setFinalRawOutput('');
        setIsReportOpen(true);

        const targetCountDesc = postLength === 'single' ? '단일 포스트(1개)' : (postLength === 'short' ? '숏 스레드(4~5개)' : '롱 스레드(7~9개)');
        const toneDesc = TONE_DESCRIPTIONS[tone] || tone;

        try {
          if (generationMode === 'deep') {
            // === DEEP RESEARCH 3-STEP PIPELINE ===

            // --- STEP 1: Deep Research (temp 0.4, max_tokens 4096) ---
            setCurrentStep(1);
            setActiveReportTab('research');

            const step1System = `소셜미디어 콘텐츠 전략 리서처. 글을 쓰지 말고 리서치만 할 것

· 문의: 당일 도매 시세 100% 현금 입금 📍`;

            const fastUser = `[포스트 작성]
- 주제: ${topic}
${targetAudience ? `- 타깃 독자: ${targetAudience}` : ''}
${keyNotes ? `- 강조 메시지/추가 메모: ${keyNotes}` : ''}`;

            let accumulatedFast = '';
            await streamCompletion({
              systemPrompt: fastSystem,
              userMessage: fastUser,
              temperature: 0.75,
              maxTokens: 4096,
              onReasoning: (chunk) => setReasoningText(prev => prev + chunk),
              onToken: (chunk) => {
                accumulatedFast += chunk;
                setFinalRawOutput(accumulatedFast);
              }
            });

            addToHistory({
              topic,
              mode: 'fast',
              platform,
              postLength,
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              research: '',
              strategy: '',
              finalRaw: accumulatedFast
            });
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            setErrorMessage(err.message || '글 생성 중 오류가 발생했습니다.');
          }
        } finally {
          setIsGenerating(false);
          setCurrentStep(0);
          abortControllerRef.current = null;
        }
      };

      // Add to memory history (max 20)
      const addToHistory = (item) => {
        setHistory(prev => [
          { id: `hist-${Date.now()}`, ...item },
          ...prev.slice(0, 19)
        ]);

        setGenerationMode(item.mode);
        setPlatform(item.platform);
        setPostLength(item.postLength);
        setResearchOutput(item.research || '');
        setStrategyOutput(item.strategy || '');
        setFinalRawOutput(item.finalRaw || '');
        setIsReportOpen(!!(item.research || item.strategy));
      };

      // Parsed posts memoized
      const parsedPosts = useMemo(() => parsePosts(finalRawOutput), [finalRawOutput]);

      // Auto-trim helper for posts exceeding character limit
      const handleTrimPost = (index) => {
        const posts = [...parsedPosts];
        if (!posts[index]) return;
        let content = posts[index].content;

        const lines = content.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        let trimmedLines = [];
        let curCount = 0;

        for (const line of lines) {
          if (curCount + line.length + 2 <= maxCharLimit - 20) {
            trimmedLines.push(line);
            curCount += line.length + 2;
          } else {
            if (line.includes('댓글') || line.includes('저장') || line.includes('공유') || line.includes('📍')) {
              trimmedLines.push(line);
            }
          }
        }

        posts[index].content = trimmedLines.join('\n\n');
        const newRaw = posts.map(p => p.content).join('\n\n###POST###\n\n');
        setFinalRawOutput(newRaw);
      };

      // Copy single post
      const handleCopyPost = (postContent, id) => {
        navigator.clipboard.writeText(postContent);
        setCopiedCardId(id);
        setTimeout(() => setCopiedCardId(null), 2000);
      };

      // Copy all posts & trigger confetti
      const handleCopyAllPosts = () => {
        if (parsedPosts.length === 0) return;
        const fullText = parsedPosts.map(p => p.content).join('\n\n---\n\n');
        navigator.clipboard.writeText(fullText);
        setCopiedAll(true);
        setTimeout(() => setCopiedAll(false), 2500);

        if (window.confetti) {

            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 }
          });

                  }`}>
                    <div className="text-xs font-semibold flex items-center gap-1">
                      {strategyOutput ? <i className="fa-solid fa-circle-check text-emerald-400"></i> : <span className="font-mono">2.</span>}
                      <span>전략 설계</span>
                    </div>
                    <span className="text-[10px] opacity-75">
                      {currentStep === 2 ? '구조 설계 진행 중...' : (strategyOutput ? '완료' : (generationMode === 'fast' ? '스킵됨' : '대기 중'))}
                    </span>
                  </div>

                  {/* Step 3 Card */}
                  <div className={`p-3 rounded-xl border transition flex flex-col items-center gap-1 ${
                    currentStep === 3
                      ? 'bg-purple-950/60 border-purple-500 text-purple-200 animate-glow-purple'
                      : (finalRawOutput && !isGenerating ? 'bg-slate-900/80 border-emerald-500/40 text-emerald-300' : 'bg-slate-900/40 border-slate-800 text-slate-500')
                  }`}>
                    <div className="text-xs font-semibold flex items-center gap-1">
                      {finalRawOutput && !isGenerating ? <i className="fa-solid fa-circle-check text-emerald-400"></i> : <span className="font-mono">3.</span>}
                      <span>최종 작성</span>
                    </div>
                    <span className="text-[10px] opacity-75">
                      {currentStep === 3 ? '글 작성 중...' : (finalRawOutput && !isGenerating ? '완료' : '대기 중')}
                    </span>
                  </div>

                </div>
              </div>

              {/* 2. Reasoning Indicator (If model streams reasoning) */}
              {reasoningText && (
                <div className="p-3 rounded-xl bg-purple-950/40 border border-purple-500/30 text-purple-200 text-xs font-mono flex items-center gap-2">
                  <i className="fa-solid fa-brain text-purple-400 animate-pulse"></i>
                  <span>🧠 모델이 깊게 생각하는 중... ({reasoningText.length.toLocaleString()}자 추론)</span>
                </div>
              )}

              {/* 3. Research & Strategy Report Panel (Collapsible Accordion) */}
              {(researchOutput || strategyOutput) && (
                <div className="glass-card rounded-2xl border border-white/10 shadow-xl overflow-hidden">
                  
                  {/* Panel Header */}
                  <div
                    onClick={() => setIsReportOpen(!isReportOpen)}
                    className="p-4 bg-slate-900/80 hover:bg-slate-900 cursor-pointer flex items-center justify-between border-b border-slate-800 transition"
                  >
                    <div className="flex items-center gap-3">
                      <i className="fa-solid fa-file-invoice text-purple-400 text-sm"></i>
                      <span className="text-xs font-bold text-slate-200">리서치 보고서 & 스레드 설계도</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] text-slate-400">
                        {isReportOpen ? '접기' : '펼치기'}
                      </span>
                      <i className={`fa-solid fa-chevron-down text-xs text-slate-400 transition-transform ${isReportOpen ? 'rotate-180' : ''}`}></i>
                    </div>
                  </div>

                  {/* Panel Body */}
                  {isReportOpen && (
                    <div className="p-4 space-y-4">
                      {/* Tabs */}
                      <div className="flex border-b border-slate-800 text-xs font-semibold">
                        <button
                          onClick={() => setActiveReportTab('research')}
                          className={`py-2 px-4 border-b-2 transition ${
                            activeReportTab === 'research'
                              ? 'border-purple-500 text-purple-300'
                              : 'border-transparent text-slate-400 hover:text-slate-200'
                          }`}
                        >
                          1단계 리서치 보고서
                        </button>
                        <button
                          onClick={() => setActiveReportTab('strategy')}
                          className={`py-2 px-4 border-b-2 transition ${
                            activeReportTab === 'strategy'
                              ? 'border-purple-500 text-purple-300'
                              : 'border-transparent text-slate-400 hover:text-slate-200'
                          }`}
                        >
                          2단계 스레드 설계도
                        </button>
                      </div>

                      {/* Content Box */}
                      <div
                        ref={reportContentRef}
                        className="bg-slate-950/80 rounded-xl p-4 max-h-80 overflow-y-auto font-mono text-xs text-slate-300 whitespace-pre-wrap leading-relaxed border border-slate-800"
                      >
                        {activeReportTab === 'research' ? (
                          researchOutput ? (
                            <span className={currentStep === 1 ? 'typing-cursor' : ''}>{researchOutput}</span>
                          ) : (
                            <span className="text-slate-500 italic">리서치 보고서 대기 중...</span>
                          )
                        ) : (
                          strategyOutput ? (
                            <span className={currentStep === 2 ? 'typing-cursor' : ''}>{strategyOutput}</span>
                          ) : (
                            <span className="text-slate-500 italic">스레드 설계도 대기 중...</span>
                          )
                        )}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* 4. Thread Cards Preview */}
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-comments text-purple-400 text-sm"></i>
                    <h2 className="text-sm font-bold text-slate-200">SNS 포스트 미리보기</h2>
                    {parsedPosts.length > 0 && (
                      <span className="text-xs px-2.5 py-0.5 rounded-full bg-purple-950 border border-purple-800/60 text-purple-300 font-mono">
                        총 {parsedPosts.length}개 포스트
                      </span>
                    )}
                  </div>

                  {parsedPosts.length > 0 && (
                    <button
                      onClick={handleCopyAllPosts}
                      className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 transition border border-slate-700 flex items-center gap-1.5"
                    >
                      <i className={`fa-solid ${copiedAll ? 'fa-check text-emerald-400' : 'fa-copy'}`}></i>
                      <span>{copiedAll ? '복사됨!' : '전체 복사'}</span>
                    </button>
                  )}
                </div>

                {/* Posts Stack */}
                {parsedPosts.length > 0 ? (
                  <div className="space-y-0 relative">
                    {parsedPosts.map((post, idx) => {
                      const isOverLimit = post.charCount > maxCharLimit;

                      return (
                        <div key={post.id || idx} className="relative group">
                          {/* Vertical Connecting Line */}
                          {idx < parsedPosts.length - 1 && (
                            <div className="absolute left-7 top-14 bottom-0 w-0.5 bg-slate-800 group-hover:bg-purple-500/30 transition z-0"></div>
                          )}

                          <div className="glass-card rounded-2xl p-5 mb-4 border border-white/10 shadow-lg relative z-10 glass-card-hover">
                            {/* Author & Actions Header */}
                            <div className="flex items-center justify-between mb-3">
                              <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-purple-500 via-pink-500 to-cyan-500 p-0.5">
                                  <div className="w-full h-full rounded-full bg-slate-900 flex items-center justify-center text-xs font-bold text-white">
                                    AI
                                  </div>
                                </div>
                                <div>
                                  <div className="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                                    <span>소셜 크리에이터</span>
                                    <i className="fa-solid fa-circle-check text-[10px] text-cyan-400"></i>
                                  </div>
                                  <div className="text-[10px] text-slate-400 font-mono">
                                    @{platform === 'threads' ? 'threads_creator' : 'x_creator'}
                                  </div>
                                </div>
                              </div>

                              <div className="flex items-center gap-2">
                                <span className="text-[10px] font-mono text-slate-400 bg-slate-900 px-2 py-0.5 rounded-md border border-slate-800">
                                  {idx + 1} / {parsedPosts.length}
                                </span>
                                <button
                                  onClick={() => handleCopyPost(post.content, post.id)}
                                  className="w-7 h-7 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs transition border border-slate-700"
                                  title="포스트 복사"
                                >
                                  <i className={`fa-solid ${copiedCardId === post.id ? 'fa-check text-emerald-400' : 'fa-copy'}`}></i>
                                </button>
                              </div>
                            </div>

                            {/* Card Content Body */}
                            <div className="text-xs text-slate-200 whitespace-pre-wrap leading-relaxed font-sans mb-4">
                              {post.content}
                              {isGenerating && idx === parsedPosts.length - 1 && currentStep === 3 && (
                                <span className="typing-cursor"></span>
                              )}
                            </div>

                            {/* Card Footer: Character Count Indicator */}
                            <div className="flex items-center justify-between border-t border-slate-800/60 pt-3 text-[10px]">
                              <div className="flex items-center gap-4 text-slate-400">
                                <span className="hover:text-pink-400 cursor-pointer transition"><i className="fa-regular fa-heart"></i></span>
                                <span className="hover:text-cyan-400 cursor-pointer transition"><i className="fa-regular fa-comment"></i></span>
                                <span className="hover:text-purple-400 cursor-pointer transition"><i className="fa-solid fa-arrows-rotate"></i></span>
                              </div>

                              <div className="flex items-center gap-2">
                                {isOverLimit && (
                                  <button
                                    onClick={() => handleTrimPost(idx)}
                                    className="px-2 py-0.5 rounded-md bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 font-sans text-[10px] font-bold transition border border-amber-500/40 flex items-center gap-1 cursor-pointer"
                                    title="글자 수 초과 문장 1초 자동 축소"
                                  >
                                    <span>✂️ 1초 축소</span>
                                  </button>
                                )}
                                <div className={`font-mono font-semibold px-2 py-0.5 rounded-md border ${
                                  isOverLimit 
                                    ? 'bg-amber-500/10 border-amber-500/30 text-amber-400' 
                                    : 'bg-slate-900 border-slate-800 text-slate-400'
                                }`}>
                                  {isOverLimit && <i className="fa-solid fa-triangle-exclamation mr-1 text-amber-400"></i>}
                                  <span>{post.charCount.toLocaleString()} / {maxCharLimit}자</span>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div className="glass-card rounded-2xl p-12 text-center border border-white/10 shadow-xl flex flex-col items-center justify-center gap-3">
                    <div className="w-12 h-12 rounded-2xl bg-slate-800/60 text-slate-400 flex items-center justify-center text-xl mb-1">
                      <i className="fa-solid fa-pen-nib"></i>
                    </div>
                    <div className="text-sm font-bold text-slate-300">소셜 미디어 글이 생성되면 이곳에 표시됩니다</div>
                    <p className="text-xs text-slate-500 max-w-sm">
                      좌측 폼에 주제를 입력하고 [딥리서치 스레드 생성] 버튼을 누르면 LM Studio가 3단계 파이프라인으로 바이럴 포스트를 작성합니다.
                    </p>
                  </div>
                )}
              </div>

            </div>
          </main>

          {/* Footer */}
          <footer className="mt-10 py-4 text-center text-xs text-slate-500 border-t border-slate-800/60 flex items-center justify-center gap-2">
            <i className="fa-solid fa-shield-halved text-emerald-400"></i>
            <span>100% 로컬 실행 · 데이터는 외부로 전송되지 않습니다</span>
          </footer>

          {/* Settings Modal */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-card rounded-2xl p-6 max-w-md w-full border border-white/15 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-slate-200 flex items-center gap-2">
                    <i className="fa-solid fa-sliders text-purple-400"></i>
                    <span>AI 엔진 및 API 설정</span>
                  </h3>
                  <button
                    onClick={() => setShowSettingsModal(false)}
                    className="text-slate-400 hover:text-slate-200 text-xs"
                  >
                    <i className="fa-solid fa-xmark text-sm"></i>
                  </button>
                </div>

                <div className="space-y-4 text-xs">
                  {/* Google Gemini API Key Section */}
                  <div className="p-3 bg-purple-950/30 rounded-xl border border-purple-800/40 space-y-2">
                    <div className="flex items-center justify-between">
                      <label className="text-xs font-bold text-purple-300 flex items-center gap-1.5">
                        <i className="fa-solid fa-key"></i>
                        <span>Google Gemini API Key (무료)</span>
                      </label>
                      <a 
                        href="https://aistudio.google.com/app/apikey" 
                        target="_blank" 
                        rel="noreferrer" 
                        className="text-[11px] text-cyan-400 hover:underline flex items-center gap-1 font-medium"
                      >
                        <span>무료 키 발급받기</span>
                        <i className="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                      </a>
                    </div>
                    <input
                      type="password"
                      value={inputGeminiKey}
                      onChange={(e) => setInputGeminiKey(e.target.value)}
                      placeholder="AIzaSy..."
                      className="w-full bg-slate-900 font-mono text-slate-200 border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:border-purple-500"
                    />
                    <p className="text-[10px] text-slate-400">
                      💡 Google AI Studio에서 발급받은 키를 입력하시면 글자 깨짐 없는 100% 완벽한 한국어 글이 초고속 생성됩니다.
                    </p>
                  </div>

                  {/* LM Studio Server URL Section */}
                  <div className="p-3 bg-slate-900/60 rounded-xl border border-slate-800 space-y-2">
                    <label className="block text-slate-300 font-semibold mb-1">LM Studio Server Base URL</label>
                    <input
                      type="text"
                      value={settingsInputUrl}
                      onChange={(e) => setSettingsInputUrl(e.target.value)}
                      placeholder="http://127.0.0.1:1234"
                      className="w-full bg-slate-900 font-mono text-slate-200 border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:border-purple-500"
                    />
                  </div>

                  {testMessage && (
                    <div className={`p-2.5 rounded-lg border text-xs flex items-center gap-2 ${
                      testMessage.type === 'success' 
                        ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' 
                        : 'bg-rose-500/10 border-rose-500/30 text-rose-300'
                    }`}>
                      <i className={`fa-solid ${testMessage.type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}`}></i>
                      <span>{testMessage.text}</span>
                    </div>
                  )}
                </div>

                <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
                  <button
                    type="button"
                    onClick={handleSaveSettings}
                    className="w-full py-2.5 rounded-xl text-xs font-bold text-white gradient-btn shadow-md"
                  >
                    저장 및 설정 완료
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
