<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없습니다 (404) | GoldLab & Co.</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=20261016_mobile_v2">
  <script>
    // GitHub Pages SPA / Clean URL rewrite handler
    (function() {
      var path = window.location.pathname.toLowerCase();
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      // Clean URL mappings
      var routes = {
        'reviews': 'reviews.html',
        'review': 'reviews.html',
        'appraisal': 'appraisal.html',
        'wholesale': 'wholesale.html',
        'reservation': 'reservation.html',
        'support': 'support.html',
        'verify': 'verify.html',
        'mypage': 'mypage.html',
        'products': 'products.html',
        'membership': 'membership.html',
        'index': 'index.html'
      };

      for (var key in routes) {
        // Matches /reviews, /reviews/, /review, etc.
        var pattern = new RegExp('(\\/|^)' + key + '(\\/?)$', 'i');
        if (pattern.test(path)) {
          window.location.replace(routes[key] + search + hash);
          return;
        }
      }
    })();
  </script>
  <style>
    body {
      background: #0b0d13;
      color: #e6edf3;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
      text-align: center;
    }
    .error-card {
      background: linear-gradient(145deg, #131722 0%, #1a202f 100%);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 24px;
      padding: 3rem 2rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
    .error-card .code {
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #fce08a 0%, #d4af37 50%, #aa7c11 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .error-card h1 {
      font-size: 1.5rem;
      margin-bottom: 0.8rem;
      color: #ffffff;
    }
    .error-card p {
      color: #8b949e;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-group {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, #d4af37, #f39c12);
      color: #0b0d13;
      font-weight: 700;
      padding: 0.8rem 1.6rem;
      border-radius: 10px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: 600;
      padding: 0.8rem 1.6rem;
      border-radius: 10px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(212, 175, 55, 0.4);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="code">404</div>
    <h1>요청하신 페이지를 찾을 수 없습니다</h1>
    <p>
      입력하신 주소가 잘못되었거나, 페이지의 주소가 변경 또는 삭제되어 요청하신 페이지를 찾을 수 없습니다.<br>
      아래 버튼을 통해 홈 또는 원하시는 페이지로 이동해 보세요.
    </p>
    <div class="btn-group">
      <a href="index.html" class="btn-primary">
        <i class="fa-solid fa-house"></i> 메인 홈으로
      </a>
      <a href="reviews.html" class="btn-secondary">
        <i class="fa-solid fa-star"></i> 고객 후기 바로가기
      </a>
    </div>
  </div>
</body>
</html>
