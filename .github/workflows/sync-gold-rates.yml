name: Daily Korea Gold Exchange Rates Auto-Sync

on:
  schedule:
    - cron: '*/15 1-3 * * 1-6'
    - cron: '*/30 4-9 * * 1-6'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-gold-rates.yml'
      - 'scripts/sync-kge-rates.js'

permissions:
  contents: write

jobs:
  sync-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Diagnostic Network Probe
        run: |
          echo "=== IP and DNS Diagnostic ==="
          curl -s https://api.ipify.org && echo ""
          echo "=== Curl probe to KGE ==="
          curl -v -X POST https://koreagoldx.co.kr/api/main -H "Content-Type: application/json" -d "{}" --max-time 10 || echo "Curl exited with code $?"

      - name: Run Gold Rate Sync Script
        run: node scripts/sync-kge-rates.js

      - name: Commit and Push Updated Rates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (GoldLab AutoSync)"
          git add app.js index.html wholesale.html mypage.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "[Auto-Sync] Update Korea Gold Exchange official rates" && git push origin main)
