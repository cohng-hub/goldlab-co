name: Daily Korea Gold Exchange Rates Auto-Sync

on:
  schedule:
    # 1. Morning Market Opening Window (10:15, 10:35, 10:55, 11:15, 11:35 KST / 01:15, 01:35, 01:55, 02:15, 02:35 UTC)
    - cron: '15,35,55 1,2 * * 1-6'
    # 2. Afternoon & Closing Market Window (12:00 ~ 17:30 KST, Every 30 mins / 03:00 ~ 08:30 UTC)
    - cron: '0,30 3-8 * * 1-6'
  workflow_dispatch: # Allow manual trigger via GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Gold Rate Sync Script
        run: node scripts/sync-kge-rates.js

      - name: Commit and Push Updated Rates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (GoldLab AutoSync)"
          git add app.js index.html wholesale.html mypage.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "[Auto-Sync] Update Korea Gold Exchange official rates" && git push)
