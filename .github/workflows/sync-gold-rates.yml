name: Daily Korea Gold Exchange Rates Auto-Sync

on:
  schedule:
    # 1. Morning Market Opening Window (10:00 ~ 12:45 KST, Every 15 mins / 01:00 ~ 03:45 UTC)
    - cron: '*/15 1-3 * * 1-6'
    # 2. Afternoon & Closing Market Window (13:00 ~ 18:00 KST, Every 30 mins / 04:00 ~ 09:00 UTC)
    - cron: '*/30 4-9 * * 1-6'
  workflow_dispatch: # Allow manual trigger via GitHub Actions tab
  push:
    paths:
      - '.github/workflows/sync-gold-rates.yml'
      - 'scripts/sync-kge-rates.js'

permissions:
  contents: write

jobs:
  sync-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Gold Rate Sync Script
        run: node scripts/sync-kge-rates.js

      - name: Commit and Push Updated Rates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (GoldLab AutoSync)"
          git add app.js index.html wholesale.html mypage.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "[Auto-Sync] Update Korea Gold Exchange official rates" && git push origin main)
